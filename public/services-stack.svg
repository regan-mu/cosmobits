<svg xmlns="http://www.w3.org/2000/svg" width="620" height="600" viewBox="0 0 620 600" role="img" aria-labelledby="cbStackTitle" class="cb-services-stack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="cbStackTitle">Four layers handled by one team: hardware and licences, cloud infrastructure, software, and AI</title>
  <!-- CosmoBits "What we do" graphic. The AI layer is the site's one glassmorphism element (spec 7.7). -->
  <g stroke="#C496C4" stroke-opacity="0.35" stroke-width="1.5">
    <line x1="596" y1="120" x2="596" y2="485"/>
    <line x1="570" y1="120" x2="596" y2="120"/>
    <line x1="570" y1="240" x2="596" y2="240"/>
    <line x1="570" y1="360" x2="596" y2="360"/>
    <line x1="570" y1="485" x2="596" y2="485"/>
  </g>
  <g fill="#C496C4">
    <circle cx="596" cy="120" r="5"/><circle cx="596" cy="240" r="5"/>
    <circle cx="596" cy="360" r="5"/><circle cx="596" cy="485" r="5"/>
  </g>
  <rect x="522" y="14" width="48" height="48" fill="#FFFFFF"/>

  <!-- AI: glass layer -->
  <rect x="190" y="70" width="380" height="100" rx="10" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.3"/>
  <g stroke="#C496C4" stroke-opacity="0.55" stroke-width="1.5">
    <line x1="240" y1="120" x2="310" y2="96"/><line x1="240" y1="120" x2="310" y2="144"/>
    <line x1="310" y1="96" x2="385" y2="120"/><line x1="310" y1="144" x2="385" y2="120"/>
    <line x1="385" y1="120" x2="462" y2="98"/><line x1="385" y1="120" x2="462" y2="142"/>
    <line x1="462" y1="98" x2="532" y2="120"/><line x1="462" y1="142" x2="532" y2="120"/>
  </g>
  <g fill="#C496C4">
    <circle cx="240" cy="120" r="5"/><circle cx="310" cy="96" r="5"/><circle cx="310" cy="144" r="5"/>
    <circle cx="462" cy="98" r="5"/><circle cx="462" cy="142" r="5"/><circle cx="532" cy="120" r="5"/>
  </g>
  <circle cx="385" cy="120" r="7" fill="#FFFFFF"/>

  <!-- Software -->
  <rect x="190" y="190" width="380" height="100" rx="10" fill="#A879B1"/>
  <rect x="210" y="208" width="70" height="64" rx="4" fill="#150F33" fill-opacity="0.22"/>
  <rect x="300" y="212" width="170" height="10" rx="5" fill="#150F33" fill-opacity="0.45"/>
  <rect x="300" y="232" width="210" height="10" rx="5" fill="#150F33" fill-opacity="0.28"/>
  <rect x="300" y="252" width="130" height="10" rx="5" fill="#150F33" fill-opacity="0.28"/>
  <rect x="470" y="248" width="70" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.85"/>

  <!-- Cloud infrastructure -->
  <rect x="190.75" y="310.75" width="378.5" height="98.5" rx="10" fill="none" stroke="#C496C4" stroke-width="1.5"/>
  <rect x="214" y="342" width="36" height="36" rx="3" fill="#C496C4"/>
  <rect x="270" y="342" width="36" height="36" rx="3" fill="#C496C4"/>
  <rect x="326.75" y="342.75" width="34.5" height="34.5" rx="3" fill="none" stroke="#C496C4" stroke-opacity="0.6" stroke-width="1.5"/>
  <rect x="382" y="342" width="36" height="36" rx="3" fill="#C496C4"/>
  <rect x="438.75" y="342.75" width="34.5" height="34.5" rx="3" fill="none" stroke="#C496C4" stroke-opacity="0.6" stroke-width="1.5"/>
  <rect x="494.75" y="342.75" width="34.5" height="34.5" rx="3" fill="none" stroke="#C496C4" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- Hardware & licences (logo's cut corner) -->
  <path d="M200,430 H560 Q570,430 570,440 V540 H242 L198,498 Q190,490 190,478 V440 Q190,430 200,430 Z" fill="#453A7D"/>
  <g fill="#150F33" fill-opacity="0.5">
    <rect x="250" y="452" width="240" height="12" rx="3"/>
    <rect x="250" y="477" width="240" height="12" rx="3"/>
    <rect x="250" y="502" width="240" height="12" rx="3"/>
  </g>
  <circle cx="530" cy="458" r="4" fill="#FFFFFF"/>
  <circle cx="530" cy="483" r="4" fill="#C496C4"/>
  <circle cx="530" cy="508" r="4" fill="#C496C4"/>

  <g font-family="'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" fill-opacity="0.74" text-anchor="end">
    <text x="172" y="125">AI</text>
    <text x="172" y="245">Software</text>
    <text x="172" y="365">Cloud infrastructure</text>
    <text x="172" y="490">Hardware &amp; licences</text>
  </g>
