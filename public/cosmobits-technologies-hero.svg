<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" aria-hidden="true" focusable="false" class="cb-hero-bits" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- CosmoBits hero graphic: the logo mark assembled from grid "bits".
       Colours: #150F33 bg (page), #453A7D deep violet, #A879B1 mauve, #C496C4 light purple, #FFFFFF.
       Classes: .cb-mark = logo pieces (fade in), .cb-bit = loose bits (slide in), see spec 7.6.
       .cb-far = bits hidden below 768px. -->
  <defs>
    <pattern id="cbCells" x="24" y="24" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect x="0.5" y="0.5" width="71" height="71" rx="4" fill="none" stroke="#C496C4" stroke-opacity="0.10"/>
    </pattern>
  </defs>
  <rect x="24" y="24" width="552" height="552" fill="url(#cbCells)"/>

  <!-- loose bits -->
  <rect class="cb-bit" style="--i:0" x="24"  y="24"  width="72" height="72" rx="4" fill="#453A7D" fill-opacity="0.6"/>
  <rect class="cb-bit cb-far" style="--i:1" x="504" y="104" width="72" height="72" rx="4" fill="#C496C4" fill-opacity="0.4"/>
  <rect class="cb-bit" style="--i:2" x="424" y="184" width="72" height="72" rx="4" fill="#C496C4" fill-opacity="0.85"/>
  <rect class="cb-bit cb-far" style="--i:3" x="504" y="344" width="72" height="72" rx="4" fill="#FFFFFF" fill-opacity="0.22"/>
  <rect class="cb-bit" style="--i:4" x="424" y="424" width="72" height="72" rx="4" fill="#A879B1" fill-opacity="0.75"/>
  <rect class="cb-bit" style="--i:5" x="468" y="276" width="36" height="36" rx="3" fill="#C496C4"/>
  <rect class="cb-bit cb-far" style="--i:6" x="540" y="250" width="18" height="18" rx="2" fill="#C496C4" fill-opacity="0.5"/>

  <!-- logo mark, enlarged: white bit, violet block with the logo's cut corner, mauve bit -->
  <rect class="cb-mark" x="264" y="24" width="152" height="152" fill="#FFFFFF"/>
  <path class="cb-mark" d="M104,184 H256 V496 L126,362 Q104,340 104,318 Z" fill="#453A7D"/>
  <rect class="cb-mark" x="264" y="344" width="152" height="152" fill="#A879B1"/>
</svg>
